# Only anonymous, unscoped catalogue browsing is eligible.
proxy_cache_path /var/cache/nginx/travel-public-catalog levels=1:2 keys_zone=travel_public_catalog:16m max_size=128m inactive=10m use_temp_path=off;
map "$http_authorization$http_cookie$http_x_organization_id$http_x_tenant_id$http_x_tenant$http_x_organization$http_x_currency$http_x_currency_code$http_x_api_key$http_x_access_token$http_x_user_id$http_x_account_id" $travel_catalog_private {
    default 1;
    "" 0;
}
map $uri $travel_catalog_route_skip {
    default 1;
    /api/v1/catalog/public/listings 0;
    /v1/catalog/public/listings 0;
}
# Unknown parameters, including dates, stock and guest filters, bypass cache.
map $args $travel_catalog_query_skip {
    default 1;
    "" 0;
    ~^(?:(?:category_code|category|limit|offset|locale|locale_code|lang|sort|q|search|collection_slug|collection_id|page)=[^&]*&?)+$ 0;
}
